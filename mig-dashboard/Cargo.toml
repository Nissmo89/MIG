[package]
name = "mig-dashboard"
version = "0.1.0"
edition = "2021"
authors = ["MIG Developer"]
description = "A Ratatui dashboard for managing MIG (Make It Green) instances"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
dirs = "5.0"
dotenv = "0.15"
tachyonfx = "0.8.0"
chrono = "0.4"
